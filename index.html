<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kernel</title>
<meta name="theme-color" content="#0e0c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kernel">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
@property --h { syntax: '<number>'; inherits: true; initial-value: 265; }

:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f4f1f8;
  --fg: #1b1826;
  --muted: #6b6580;
  --line: rgba(27, 24, 38, .12);
  --panel: rgba(255, 255, 255, .62);
  --panel-solid: #ffffff;
  --gl: 84%;
  --gl2: 90%;
  --gs: 72%;
  --dot-l: 48%;
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0c14;
    --fg: #f2eef8;
    --muted: #a59fb8;
    --line: rgba(255, 255, 255, .12);
    --panel: rgba(255, 255, 255, .07);
    --panel-solid: #1a1724;
    --gl: 25%;
    --gl2: 15%;
    --gs: 62%;
    --dot-l: 68%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0c14;
  --fg: #f2eef8;
  --muted: #a59fb8;
  --line: rgba(255, 255, 255, .12);
  --panel: rgba(255, 255, 255, .07);
  --panel-solid: #1a1724;
  --gl: 25%;
  --gl2: 15%;
  --gs: 62%;
  --dot-l: 68%;
  color-scheme: dark;
}

html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, label:focus-within { outline: 2px solid hsl(var(--h) 80% 60%); outline-offset: 2px; }
.vh { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.hidden { display: none !important; }

#app {
  --h: 265;
  transition: --h .8s ease;
  position: relative;
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background:
    radial-gradient(95% 55% at 12% 0%, hsl(var(--h) var(--gs) var(--gl) / .95), transparent 72%),
    radial-gradient(85% 50% at 100% 100%, hsl(calc(var(--h) + 45) var(--gs) var(--gl2) / .8), transparent 72%),
    var(--bg);
}

/* top bar */
#top { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px 6px; flex: none; }
.brand { font-family: var(--serif); font-weight: 600; font-size: 24px; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.brand i { width: 11px; height: 11px; border-radius: 50%; background: hsl(var(--h) 85% var(--dot-l)); display: inline-block; box-shadow: 0 0 0 4px hsl(var(--h) 85% var(--dot-l) / .22); }
.top-r { display: flex; align-items: center; gap: 8px; }
.pill { font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); }
.icon-btn svg { width: 17px; height: 17px; }

main { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; }

/* feed */
#feed { overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; }
#feed::-webkit-scrollbar { display: none; }
.card { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; position: relative; display: flex; flex-direction: column; padding: 10px 76px 18px 22px; box-sizing: border-box; }
.meta { display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; max-width: 100%; padding: 7px 13px 7px 11px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font-size: 13px; font-weight: 500; }
.meta .dot { width: 9px; height: 9px; border-radius: 50%; background: hsl(var(--h) 85% var(--dot-l)); flex: none; }
.meta .bt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta .pg { color: var(--muted); font-weight: 400; flex: none; }
.body { flex: 1; min-height: 0; display: flex; align-items: flex-start; overflow-y: auto; scrollbar-width: none; }
.col { width: 100%; margin: auto 0; box-sizing: border-box; border-left: 3px solid hsl(var(--h) 80% var(--dot-l)); padding: 14px 0 14px 18px; }
.ttl { font-family: var(--sans); font-weight: 600; font-size: 15px; line-height: 1.3; margin: 0 0 10px; color: hsl(var(--h) 55% calc(var(--dot-l) - 6%)); }
.body::-webkit-scrollbar { display: none; }
.txt { margin: 0; font-family: var(--serif); font-weight: 400; line-height: 1.42; letter-spacing: -.006em; font-variation-settings: 'opsz' 48; text-wrap: pretty; }
.txt.swap { animation: swap .4s ease; }
@keyframes swap { from { opacity: 0; } to { opacity: 1; } }
.ai-st { white-space: nowrap; }
.s1 { font-size: clamp(25px, 6.8vw, 34px); line-height: 1.32; }
.s2 { font-size: clamp(21px, 5.6vw, 27px); }
.s3 { font-size: clamp(18px, 4.7vw, 22px); }
.rail { position: absolute; right: 12px; bottom: 74px; display: flex; flex-direction: column; gap: 14px; }
.rail button { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: transform .15s ease, background .2s ease; }
.rail button:active { transform: scale(.9); }
.rail svg { width: 21px; height: 21px; }
.rail .on { background: hsl(var(--h) 80% var(--dot-l)); color: #fff; border-color: transparent; }
.rail .on svg { fill: currentColor; }
.foot { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--muted); padding-top: 6px; }
.bar { flex: 1; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: hsl(var(--h) 80% var(--dot-l)); }

.empty { height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 30px 40px; box-sizing: border-box; }
.empty h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(34px, 9.5vw, 46px); line-height: 1.08; letter-spacing: -.025em; margin: 0 0 14px; }
.empty p { color: var(--muted); font-size: 16px; line-height: 1.5; margin: 0 0 26px; max-width: 32ch; }

.btn { display: inline-block; padding: 14px 22px; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 600; font-size: 15px; margin-right: 8px; margin-bottom: 8px; }
.btn.ghost { background: var(--panel); color: var(--fg); border: 1px solid var(--line); }

/* library + saved */
.scroll { overflow-y: auto; padding: 8px 18px 24px; box-sizing: border-box; overscroll-behavior: contain; }
.scroll h2 { font-family: var(--serif); font-weight: 500; font-size: 32px; letter-spacing: -.02em; margin: 6px 0 4px; }
.sub { color: var(--muted); font-size: 15px; margin: 0 0 18px; line-height: 1.45; }
.drop { display: block; text-align: center; padding: 22px 16px; border: 1.5px dashed var(--line); border-radius: 20px; background: var(--panel); margin-bottom: 16px; cursor: pointer; }
.drop b { display: block; font-size: 16px; font-weight: 600; margin-bottom: 3px; }
.drop small { color: var(--muted); font-size: 13px; }
.row { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.row .sw { width: 12px; align-self: stretch; border-radius: 6px; background: hsl(var(--h) 80% var(--dot-l)); flex: none; }
.row .info { flex: 1; min-width: 0; }
.row .t { font-weight: 600; font-size: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .m { color: var(--muted); font-size: 13px; margin-top: 3px; }
.row .bar { margin-top: 8px; flex: none; }
.tog { position: relative; width: 44px; height: 26px; flex: none; }
.tog input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 2; }
.tog span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; }
.tog span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.tog input:checked + span { background: hsl(var(--h) 75% 50%); }
.tog input:checked + span::after { transform: translateX(18px); }
.tog input:focus-visible + span { outline: 2px solid hsl(var(--h) 80% 60%); outline-offset: 2px; }
.del { font-size: 13px; color: var(--muted); padding: 8px 6px; flex: none; }
.del.arm { color: #d64550; font-weight: 600; }
.job .m { margin-bottom: 0; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 4px 14px; font-size: 15px; }
.opt small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.snip { padding: 16px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 10px; }
.snip p { font-family: var(--serif); font-size: 17px; line-height: 1.5; margin: 0 0 12px; }
.snip .sf { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); gap: 10px; }
.snip .sf span { display: flex; align-items: center; gap: 8px; min-width: 0; }
.snip .sf .d { width: 9px; height: 9px; border-radius: 50%; background: hsl(var(--h) 85% var(--dot-l)); flex: none; }

.ai { margin-top: 10px; padding-top: 20px; border-top: 1px solid var(--line); }
.ai h3 { font-family: var(--serif); font-weight: 500; font-size: 23px; letter-spacing: -.015em; margin: 0 0 6px; }
.field { width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-solid); color: var(--fg); font: inherit; font-size: 16px; margin-bottom: 12px; }
.fine { color: var(--muted); font-size: 13px; line-height: 1.55; margin: 6px 0 0; }
.fine a { color: inherit; }
.snip h4 { font-family: var(--sans); font-size: 14px; font-weight: 600; margin: 0 0 6px; }

.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 14px; }
.seg button { flex: 1; padding: 10px 6px; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--muted); }
.seg button.act { background: var(--panel-solid); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.18); }

/* nav */
#nav { flex: none; display: flex; padding: 6px 14px 10px; gap: 6px; border-top: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
#nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 4px; font-size: 12px; font-weight: 500; color: var(--muted); border-radius: 14px; }
#nav button svg { width: 23px; height: 23px; }
#nav button.act { color: var(--fg); }
#nav button.act svg { color: hsl(var(--h) 80% var(--dot-l)); }

#toast { position: absolute; left: 50%; bottom: 86px; transform: translate(-50%, 14px); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 86%; text-align: center; z-index: 20; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  #app { transition: none; }
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><i></i>Kernel</div>
    <div class="top-r">
      <span class="pill" id="count">0 today</span>
      <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>
  <main>
    <section id="feed" class="view" aria-label="Snippet feed"></section>
    <section id="library" class="view scroll hidden"></section>
    <section id="saved" class="view scroll hidden"></section>
  </main>
  <nav id="nav">
    <button data-view="feed" class="act"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6"/></svg>Learn</button>
    <button data-view="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>Books</button>
    <button data-view="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>Saved</button>
  </nav>
  <div id="toast" role="status"></div>
</div>

<script>
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const HUES = [265, 18, 160, 330, 205, 45, 120, 350];
  const ICON = {
    bookmark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
    spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3l1.9 5.6L18.5 10.5l-5.6 1.9L11 18l-1.9-5.6L3.5 10.5l5.6-1.9z"/><path d="M19 3v4M17 5h4"/></svg>'
  };

  /* ---------- persistence ---------- */
  const LS = 'kernel-state-v1';
  let state = { active: {}, progress: {}, saved: [], shuffle: false, today: { d: '', n: 0 }, theme: '', ai: false };
  try { Object.assign(state, JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) {}
  function persist() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }

  const DB = {
    db: null, mem: [], aimem: new Map(),
    async aiGet(k) {
      try { const db = await this.open(); return await new Promise((res, rej) => { const q = db.transaction('ai').objectStore('ai').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); }); }
      catch (e) { return this.aimem.get(k) || null; }
    },
    async aiPut(k, v) {
      try { const db = await this.open(); await new Promise((res, rej) => { const t = db.transaction('ai', 'readwrite'); t.objectStore('ai').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
      catch (e) { this.aimem.set(k, v); }
    },
    async aiDelBook(id) {
      for (const k of [...this.aimem.keys()]) if (k.startsWith(id + ':')) this.aimem.delete(k);
      try { const db = await this.open(); await new Promise((res, rej) => { const t = db.transaction('ai', 'readwrite'); t.objectStore('ai').delete(IDBKeyRange.bound(id + ':', id + ':\uffff')); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) {}
    },
    open() {
      if (this.db) return Promise.resolve(this.db);
      return new Promise((res, rej) => {
        try {
          const r = indexedDB.open('kernel', 2);
          r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('books')) d.createObjectStore('books', { keyPath: 'id' }); if (!d.objectStoreNames.contains('ai')) d.createObjectStore('ai'); };
          r.onsuccess = () => { this.db = r.result; res(this.db); };
          r.onerror = () => rej(r.error);
        } catch (e) { rej(e); }
      });
    },
    async all() {
      try {
        const db = await this.open();
        return await new Promise((res, rej) => { const q = db.transaction('books').objectStore('books').getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
      } catch (e) { return this.mem; }
    },
    async put(b) {
      try {
        const db = await this.open();
        await new Promise((res, rej) => { const t = db.transaction('books', 'readwrite'); t.objectStore('books').put(b); t.oncomplete = res; t.onerror = () => rej(t.error); });
      } catch (e) { this.mem = this.mem.filter(x => x.id !== b.id).concat(b); }
    },
    async del(id) {
      try {
        const db = await this.open();
        await new Promise((res, rej) => { const t = db.transaction('books', 'readwrite'); t.objectStore('books').delete(id); t.oncomplete = res; t.onerror = () => rej(t.error); });
      } catch (e) { this.mem = this.mem.filter(x => x.id !== id); }
    }
  };

  /* ---------- theme ---------- */
  const root = document.documentElement;
  if (state.theme) root.dataset.theme = state.theme;
  const effTheme = () => root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  $('#themeBtn').onclick = () => { const n = effTheme() === 'dark' ? 'light' : 'dark'; root.dataset.theme = n; state.theme = n; persist(); };

  /* ---------- data ---------- */
  let books = [];
  let jobs = [];
  let dirty = true;
  const app = $('#app');
  const feedEl = $('#feed');
  const seen = new Set();

  const activeBooks = () => books.filter(b => state.active[b.id] !== false && b.chunks.length);
  const todayKey = () => new Date().toISOString().slice(0, 10);
  function bumpToday() {
    if (state.today.d !== todayKey()) state.today = { d: todayKey(), n: 0 };
    state.today.n++;
    showCount();
  }
  function showCount() {
    const n = state.today.d === todayKey() ? state.today.n : 0;
    $('#count').textContent = n + ' today';
  }

  /* ---------- pdf -> snippets ---------- */
  function linesToText(lines) {
    let out = '';
    for (let l of lines) {
      l = l.trim();
      if (!l || /^\d{1,4}$/.test(l)) continue;
      if (/\p{L}-$/u.test(out)) out = out.slice(0, -1) + l;
      else out += (out ? ' ' : '') + l;
    }
    return out;
  }
  function pageToText(items) {
    const lines = []; let line = '';
    for (const it of items) {
      if (typeof it.str !== 'string') continue;
      line += it.str;
      if (it.hasEOL) { lines.push(line); line = ''; }
    }
    if (line) lines.push(line);
    return linesToText(lines);
  }
  function good(t) {
    const words = t.split(/\s+/).length;
    if (words < 20 || words > 170) return false;
    const letters = (t.match(/\p{L}/gu) || []).length;
    const digits = (t.match(/\d/g) || []).length;
    if (letters / t.length < 0.72 || digits / t.length > 0.08) return false;
    if (/\.{4,}|ISBN|©|all rights reserved|www\./i.test(t)) return false;
    return true;
  }
  function groupSentences(sents) {
    const out = []; let cur = [], w = 0, pg = 0;
    for (const { s, p } of sents) {
      if (!cur.length) pg = p;
      cur.push(s); w += s.split(/\s+/).length;
      if (w >= 50) { out.push({ t: cur.join(' '), p: pg }); cur = []; w = 0; }
    }
    if (w >= 25) out.push({ t: cur.join(' '), p: pg });
    return out.filter(c => good(c.t));
  }
  function splitSentences(text, page, carryIn, sents) {
    const re = /[^.!?]*[.!?]+["”’')\]]*(?=\s|$)/g;
    let carry = (carryIn + ' ' + text).replace(/\s+/g, ' ').trim();
    let m, last = 0;
    while ((m = re.exec(carry))) { const s = m[0].trim(); if (s) sents.push({ s, p: page }); last = re.lastIndex; }
    carry = carry.slice(last);
    if (carry.length > 1500) { sents.push({ s: carry, p: page }); carry = ''; }
    return carry;
  }

  async function addBook(title, chunks) {
    const id = 'b' + Date.now() + Math.random().toString(36).slice(2, 6);
    const book = { id, title, hue: HUES[books.length % HUES.length], chunks, added: Date.now() };
    await DB.put(book);
    books.push(book);
    state.active[id] = true;
    state.progress[id] = 0;
    persist();
    dirty = true;
    return book;
  }

  const TESS_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  function loadScript(src) {
    return new Promise((res, rej) => {
      const el = document.createElement('script');
      el.src = src; el.onload = res;
      el.onerror = () => rej(new Error('Text recognition could not load. Check your connection and try again.'));
      document.head.appendChild(el);
    });
  }

  async function importPdf(file) {
    const job = { id: 'j' + Date.now() + Math.random().toString(36).slice(2, 5), name: file.name.replace(/\.pdf$/i, ''), pct: 0, err: '', ocr: false, stop: false };
    jobs.push(job); renderLibrary();
    const setLab = t => { const el = document.getElementById('lab-' + job.id); if (el) el.textContent = t; };
    const setBar = n => { job.pct = n; const el = document.getElementById('bar-' + job.id); if (el) el.style.width = n + '%'; };
    let worker = null, wake = null;
    try {
      if (!window.pdfjsLib) throw new Error('The PDF reader could not load. Check your connection and reload.');
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      let title = job.name.replace(/[_-]+/g, ' ').trim();
      try { const meta = await pdf.getMetadata(); const mt = meta && meta.info && meta.info.Title; if (mt && mt.trim().length > 3) title = mt.trim(); } catch (e) {}

      const n = pdf.numPages;
      const pages = new Array(n + 1).fill('');
      for (let p = 1; p <= n; p++) {
        const page = await pdf.getPage(p);
        const tc = await page.getTextContent();
        pages[p] = pageToText(tc.items);
        setBar(Math.round((p / n) * 100));
        setLab('Reading page ' + p + ' of ' + n);
      }

      // Pages with no selectable text are pictures. If most of the book is like that, read them with OCR.
      const missing = [];
      for (let p = 1; p <= n; p++) if (pages[p].length < 40) missing.push(p);
      if (n > 0 && missing.length >= n * 0.6) {
        job.ocr = true; job.pct = 0; renderLibrary();
        setLab('Getting text recognition ready');
        try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
        if (!window.Tesseract) await loadScript(TESS_SRC);
        let ready = false;
        worker = await Tesseract.createWorker('eng', 1, {
          logger: m => {
            if (ready || !m || typeof m.progress !== 'number') return;
            setLab('Getting text recognition ready (first time only) ' + Math.round(m.progress * 100) + '%');
          }
        });
        ready = true;
        const canvas = document.createElement('canvas');
        let done = 0;
        for (const p of missing) {
          if (job.stop) break;
          setLab('Reading page ' + p + ' of ' + n + ' with text recognition');
          const page = await pdf.getPage(p);
          const base = page.getViewport({ scale: 1 });
          const scale = Math.min(2.5, 2400 / Math.max(base.width, base.height));
          const vp = page.getViewport({ scale });
          canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          await page.render({ canvasContext: ctx, viewport: vp }).promise;
          const res = await worker.recognize(canvas);
          pages[p] = linesToText((res.data.text || '').split('\n'));
          done++;
          setBar(Math.round((done / missing.length) * 100));
        }
        canvas.width = 0; canvas.height = 0;
      }

      const sents = []; let carry = '';
      for (let p = 1; p <= n; p++) carry = splitSentences(pages[p], p, carry, sents);
      const chunks = groupSentences(sents).map(c => ({ t: c.t, p: c.p }));
      if (chunks.length < 3) {
        throw new Error(job.stop
          ? 'Stopped before enough text was read. Let it run a little longer next time.'
          : job.ocr
            ? 'Text recognition found very little text. The scan may be too faint, or not in English.'
            : 'No readable text found in this file.');
      }
      await addBook(title, chunks);
      jobs = jobs.filter(j => j !== job);
      toast('Added ' + chunks.length + ' snippets');
      renderLibrary();
      if (books.length === 1) showView('feed');
    } catch (e) {
      job.ocr = false;
      job.err = (e && e.message) ? e.message : 'Could not read this file.';
      renderLibrary();
    } finally {
      try { if (worker) await worker.terminate(); } catch (e) {}
      try { if (wake) await wake.release(); } catch (e) {}
    }
  }

  const DEMO = [
    'Welcome to Kernel. Every card is one small idea, lifted out of the books you add. Swipe up to move on. The aim is a little progress often, rather than one heroic effort once a week.',
    'Short bursts work because attention is limited. A single well-chosen paragraph, read properly, tends to stick better than a chapter skimmed while distracted. Small units also make it easy to begin, which is usually the hardest part of studying.',
    'Try mixing books. Kernel takes one snippet from each active book in turn, so a physics passage can sit beside a history one. Switching topics is a form of interleaving, and it tends to help ideas transfer to new situations later on.',
    'Tap the bookmark on any card to keep it. Saved snippets live in their own tab, so you can build a small collection of the passages worth coming back to before an exam or a conversation.',
    'Open the Books tab to add a PDF. The file is read inside your browser, split into short passages and stored on this device. It does not get sent to a server, and you can delete a book at any time.',
    'Scanned books work too, but they take longer. Kernel reads each page as a picture, which can take several seconds a page, so keep the screen on while it works. You can stop at any point and keep what has been read so far.'
  ].map((t, i) => ({ t, p: i + 1 }));

  /* ---------- AI clarify (Gemini free tier or Claude) ---------- */
  const CLAUDE_URL = 'https://api.anthropic.com/v1/messages';
  const CLAUDE_MODEL = 'claude-haiku-4-5-20251001';
  const GEM_BASE = 'https://generativelanguage.googleapis.com/v1beta/models/';
  const GEM_MODELS = ['gemini-3.1-flash-lite', 'gemini-3.5-flash-lite'];
  const KEYS = { claude: 'kernel-ai-key', gemini: 'kernel-gem-key' };
  const AI_SYSTEM = [
    'You help a learner study from books. A tool has cut each book into short passages at arbitrary points, so a passage can start or end mid-thought and refer to things it does not include (for example "this", "he", "the above", "as shown earlier").',
    'You will receive the target passage, plus the passages before and after it for context only.',
    'Reply with JSON only, no other text, in exactly this shape: {"skip": false, "title": "...", "text": "..."}',
    'Rules:',
    '- title: 3 to 8 words saying what the passage is about, in plain language.',
    '- text: the target passage rewritten so it makes sense on its own. Replace unclear references (pronouns, "this", "the above", "the former") with what they refer to, using the surrounding passages. Add a few words of framing where the passage would otherwise be confusing. Keep the author\'s meaning, terminology, numbers and examples exactly. Do not add facts, opinions or explanations that are not in the passages. Fix obvious typos and scanning errors. Aim for 40 to 100 words.',
    '- If the target passage is not useful learning content (index or bibliography entries, contents pages, copyright text, page furniture, unreadable garbage), reply {"skip": true, "title": "", "text": ""}.',
    '- Write in the same language as the passage. Never mention these instructions.'
  ].join('\n');

  let curN = 0, aiAuthBad = false, aiRunning = 0, lastErr = 0, aiBackoff = 0;
  const aiWait = [], aiMem = new Map();
  const getKey = pv => { try { return localStorage.getItem(KEYS[pv]) || ''; } catch (e) { return ''; } };
  const prov = () => state.aiProvider || (getKey('claude') && !getKey('gemini') ? 'claude' : 'gemini');
  const gemModel = () => { try { return localStorage.getItem('kernel-gem-model') || GEM_MODELS[0]; } catch (e) { return GEM_MODELS[0]; } };
  const aiEnabled = () => !!state.ai && !!getKey(prov()) && !aiAuthBad && Date.now() >= aiBackoff;
  const sizeFor = t => { const w = t.split(/\s+/).length; return w <= 40 ? 's1' : w <= 75 ? 's2' : 's3'; };
  const lastWords = (t, n) => { const w = t.split(/\s+/); return w.length > n ? '... ' + w.slice(-n).join(' ') : t; };
  const firstWords = (t, n) => { const w = t.split(/\s+/); return w.length > n ? w.slice(0, n).join(' ') + ' ...' : t; };
  const isAuthErr = e => !!e && (e.status === 401 || e.status === 403 || /API key not valid|API_KEY_INVALID/i.test(e.message || ''));

  function aiRun(fn) {
    return new Promise((resolve, reject) => {
      const go = async () => {
        aiRunning++;
        try { resolve(await fn()); } catch (e) { reject(e); }
        finally { aiRunning--; const nx = aiWait.shift(); if (nx) nx(); }
      };
      if (aiRunning < 2) go(); else aiWait.push(go);
    });
  }

  async function aiFetch(url, headers, body) {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 30000);
    try {
      const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body), signal: ctl.signal });
      if (!res.ok) {
        let msg = ''; try { const j = await res.json(); msg = (j.error && j.error.message) || ''; } catch (e) {}
        const err = new Error(msg || ('Request failed (' + res.status + ')')); err.status = res.status; throw err;
      }
      return await res.json();
    } finally { clearTimeout(to); }
  }
  const claudeCall = (key, body) => aiFetch(CLAUDE_URL, { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body);
  const geminiCall = (key, model, body) => aiFetch(GEM_BASE + model + ':generateContent', { 'content-type': 'application/json', 'x-goog-api-key': key }, body);

  async function callAI(f) {
    const c = f.b.chunks[f.i], prev = f.b.chunks[f.i - 1], next = f.b.chunks[f.i + 1];
    const user = 'Book: ' + f.b.title +
      '\n\n<previous_passage>\n' + (prev ? lastWords(prev.t, 90) : '(none)') + '\n</previous_passage>' +
      '\n\n<target_passage>\n' + c.t + '\n</target_passage>' +
      '\n\n<next_passage>\n' + (next ? firstWords(next.t, 90) : '(none)') + '\n</next_passage>';
    let text;
    if (prov() === 'claude') {
      const d = await claudeCall(getKey('claude'), { model: CLAUDE_MODEL, max_tokens: 500, system: AI_SYSTEM, messages: [{ role: 'user', content: user }] });
      text = (d.content || []).filter(x => x.type === 'text').map(x => x.text).join('');
    } else {
      const d = await geminiCall(getKey('gemini'), gemModel(), {
        systemInstruction: { parts: [{ text: AI_SYSTEM }] },
        contents: [{ role: 'user', parts: [{ text: user }] }],
        generationConfig: { maxOutputTokens: 2048, temperature: 0.3, responseMimeType: 'application/json' }
      });
      const cand = (d.candidates || [])[0];
      text = ((cand && cand.content && cand.content.parts) || []).map(x => x.text || '').join('');
    }
    const m = text.match(/\{[\s\S]*\}/);
    if (!m) throw new Error('Unexpected reply');
    const o = JSON.parse(m[0]);
    const out = { skip: !!o.skip, title: String(o.title || '').trim(), text: String(o.text || '').trim() };
    if (!out.skip && out.text.length < 20) throw new Error('Unexpected reply');
    return out;
  }

  function aiError(err) {
    if (isAuthErr(err)) aiAuthBad = true;
    if (err && err.status === 429) aiBackoff = Date.now() + 60000;
    const now = Date.now();
    if (now - lastErr < 10000) return;
    lastErr = now;
    if (isAuthErr(err)) toast('Your AI key was rejected. Check it in Books.', 4500);
    else if (err && err.status === 429) toast('AI limit reached for now. Showing the original text.', 4500);
    else if (err && /credit/i.test(err.message || '')) toast('Your Anthropic account is out of credit.', 4500);
    else toast('AI is unavailable right now. Showing the original text.', 3500);
  }

  async function enhance(n) {
    const f = feed[n];
    if (!f || f.aiState || !aiEnabled()) return;
    f.aiState = 'loading';
    const k = f.b.id + ':' + f.i;
    try {
      let r = aiMem.get(k) || await DB.aiGet(k);
      if (!r) {
        r = await aiRun(() => callAI(f));
        await DB.aiPut(k, r);
      }
      aiMem.set(k, r);
      f.ai = r; f.aiState = r.skip ? 'skip' : 'done';
      applyAI(n);
    } catch (err) {
      f.aiState = 'failed';
      aiError(err);
    }
  }

  function cardEl(n) { return feedEl.querySelector('.card[data-n="' + n + '"]'); }
  function applyAI(n) {
    const f = feed[n], el = cardEl(n);
    if (!f || !el) return;
    if (f.aiState === 'skip') {
      if (n !== curN) { io.unobserve(el); el.remove(); return; }
      el.querySelector('.ai-st').textContent = 'Probably filler';
      return;
    }
    if (f.aiState === 'done') renderAI(n, true);
  }
  function renderAI(n, animate) {
    const f = feed[n], el = cardEl(n);
    if (!f || !el || !f.ai) return;
    const showAI = f.showAI !== false;
    const text = showAI ? f.ai.text : f.b.chunks[f.i].t;
    const txt = el.querySelector('.txt'), ttl = el.querySelector('.ttl'), tog = el.querySelector('.ai-tog');
    txt.textContent = text;
    txt.className = 'txt ' + sizeFor(text);
    if (animate !== false) { void txt.offsetWidth; txt.classList.add('swap'); }
    ttl.textContent = f.ai.title;
    ttl.classList.toggle('hidden', !(showAI && f.ai.title));
    tog.classList.remove('hidden');
    tog.classList.toggle('on', showAI);
    el.querySelector('.ai-st').textContent = showAI ? 'Clarified with AI' : 'Original text';
  }

  function explainErr(pv, err) {
    if (isAuthErr(err)) return pv === 'gemini' ? 'Google rejected that key. Check that you copied all of it, and that it came from Google AI Studio.' : 'That key was rejected. Check that you copied all of it.';
    if (err.status === 429) return 'The key looks valid, but the free limit is used up right now. Try again in a minute.';
    if (/credit/i.test(err.message || '')) return 'The key is valid, but the account has no credit yet. Add credit in the Console, then try again.';
    if (err.status) return String(err.message || 'Something went wrong.').slice(0, 160);
    return 'Could not reach the service. Check your connection and try again.';
  }
  async function saveKey() {
    const pv = prov(), inp = $('#akey'), st = $('#astatus');
    const val = ((inp && inp.value) || '').trim();
    if (pv === 'claude' && !/^sk-ant-/.test(val)) { st.textContent = 'That does not look like an Anthropic key. Keys start with sk-ant-'; return; }
    if (pv === 'gemini' && (val.length < 20 || /\s/.test(val))) { st.textContent = 'That does not look like a Gemini key. Copy the whole key from Google AI Studio.'; return; }
    st.textContent = 'Checking the key...';
    let okModel = '';
    try {
      if (pv === 'claude') {
        await claudeCall(val, { model: CLAUDE_MODEL, max_tokens: 8, messages: [{ role: 'user', content: 'Reply with: ok' }] });
      } else {
        for (const m of GEM_MODELS) {
          try {
            await geminiCall(val, m, { contents: [{ role: 'user', parts: [{ text: 'Reply with: ok' }] }], generationConfig: { maxOutputTokens: 64 } });
            okModel = m; break;
          } catch (e) { if (e.status === 404) continue; throw e; }
        }
        if (!okModel) { const e = new Error('No free Gemini model was found. The model names may have changed.'); e.status = 404; throw e; }
      }
    } catch (err) { st.textContent = explainErr(pv, err); return; }

      localStorage.setItem(KEYS[pv], val);

  function aiSection() {

      : 'This uses your own Anthropic API account, which is billed separately from a Claude subscription. Expect roughly $1 to $2 per 1,000 snippets. Each snippet you read is sent to Anthropic. <a href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener">Get a key</a>';

  /* ---------- feed ---------- */
  let feed = [], ptr = {}, rr = 0;

  function extend(n) {

  }

  function buildFeed() {
    io.disconnect();

      feedEl.innerHTML =
        '<div class="empty"><h1>Turn any book into a scroll.</h1>' +

  feedEl.addEventListener('click', async e => {

      else {

    }
  });

  /* ---------- library ---------- */
  function renderLibrary() {
    const L = $('#library');
    const jobHtml = jobs.map(j =>
      '<div class="row job"><div class="sw" style="--h:265"></div><div class="info"><div class="t">' + esc(j.name) + '</div>' +
      (j.err ? '<div class="m" style="color:#d64550">' + esc(j.err) + '</div>' :
        '<div class="m" id="lab-' + j.id + '">Reading</div><div class="bar"><i id="bar-' + j.id + '" style="width:' + j.pct + '%"></i></div>') +
      '</div>' + (j.err ? '<button class="del" data-dismiss="' + j.id + '">Dismiss</button>' : (j.ocr ? '<button class="del" data-stop="' + j.id + '">' + (j.stop ? 'Stopping' : 'Stop and keep') + '</button>' : '')) + '</div>').join('');
    const bookHtml = books.map(b => {
      const pr = Math.min(100, Math.round(((state.progress[b.id] || 0) / b.chunks.length) * 100));
      return '<div class="row" style="--h:' + b.hue + '"><div class="sw"></div><div class="info"><div class="t">' + esc(b.title) + '</div>' +
        '<div class="m">' + b.chunks.length + ' snippets, ' + pr + '% read</div><div class="bar"><i style="width:' + pr + '%"></i></div></div>' +
        '<label class="tog" aria-label="Include in feed"><input type="checkbox" data-tog="' + b.id + '"' + (state.active[b.id] !== false ? ' checked' : '') + '><span></span></label>' +
        '<button class="del" data-del="' + b.id + '">Delete</button></div>';
    }).join('');
    L.innerHTML =
      '<h2>Books</h2><p class="sub">Every book you switch on feeds your scroll.</p>' +
      '<label class="drop"><input class="vh" id="file" type="file" accept="application/pdf,.pdf" multiple><b>Add a PDF</b><small>Scanned books work too. Read on your device, never uploaded</small></label>' +
      jobHtml + bookHtml +
      (books.length ? '<div class="opt"><div>Shuffle snippets<small>Off keeps each book in reading order</small></div><label class="tog" style="--h:265"><input type="checkbox" id="shuf"' + (state.shuffle ? ' checked' : '') + '><span></span></label></div>' : '') + aiSection();
  }

  $('#library').addEventListener('change', e => {
    if (e.target.id === 'file') { [...e.target.files].forEach(importPdf); e.target.value = ''; return; }
    if (e.target.dataset.tog) { state.active[e.target.dataset.tog] = e.target.checked; persist(); dirty = true; return; }
    if (e.target.id === 'aion') { state.ai = e.target.checked; aiAuthBad = false; persist(); dirty = true; return; }
    if (e.target.id === 'shuf') { state.shuffle = e.target.checked; persist(); dirty = true; }
  });
  $('#library').addEventListener('click', async e => {
    const pvb = e.target.closest('[data-prov]');
    if (pvb) { state.aiProvider = pvb.dataset.prov; aiAuthBad = false; aiBackoff = 0; persist(); dirty = true; renderLibrary(); return; }
    if (e.target.closest('#asave')) return saveKey();
    if (e.target.closest('#aremove')) { removeKey(); return; }
    const d = e.target.closest('[data-del]');
    if (d) {
      if (!d.classList.contains('arm')) { d.classList.add('arm'); d.textContent = 'Sure?'; setTimeout(() => { d.classList.remove('arm'); d.textContent = 'Delete'; }, 3000); return; }
      const id = d.dataset.del;
      await DB.del(id); await DB.aiDelBook(id); books = books.filter(b => b.id !== id); delete state.active[id]; delete state.progress[id];
      persist(); dirty = true; renderLibrary(); return;
    }
    const st = e.target.closest('[data-stop]');
    if (st) { const j = jobs.find(j => j.id === st.dataset.stop); if (j) { j.stop = true; renderLibrary(); } return; }
    const x = e.target.closest('[data-dismiss]');
    if (x) { jobs = jobs.filter(j => j.id !== x.dataset.dismiss); renderLibrary(); }
  });

  /* ---------- saved ---------- */
  function renderSaved() {
    const S = $('#saved');
    S.innerHTML = '<h2>Saved</h2><p class="sub">' + (state.saved.length ? 'Passages worth coming back to.' : 'Tap the bookmark on a card to keep it here.') + '</p>' +
      state.saved.map(s =>
        '<div class="snip" style="--h:' + s.hue + '">' + (s.h ? '<h4>' + esc(s.h) + '</h4>' : '') + '<p>' + esc(s.t) + '</p><div class="sf"><span><i class="d"></i>' + esc(s.title) + ', p. ' + s.p + '</span><button class="del" data-rm="' + esc(s.k) + '">Remove</button></div></div>').join('');
  }
  $('#saved').addEventListener('click', e => {
    const r = e.target.closest('[data-rm]'); if (!r) return;
    state.saved = state.saved.filter(s => s.k !== r.dataset.rm); persist(); renderSaved();
  });

  /* ---------- nav + toast ---------- */
  let tt;
  function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), ms || 1800); }
  function showView(v) {
    ['feed', 'library', 'saved'].forEach(id => $('#' + id).classList.toggle('hidden', id !== v));
    document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('act', b.dataset.view === v));
    if (v === 'feed' && dirty) buildFeed();
    if (v === 'library') renderLibrary();
    if (v === 'saved') renderSaved();
    if (v !== 'feed') app.style.setProperty('--h', 265);
    else if (feed[0]) { const cards = feedEl.querySelectorAll('.card'); }
  }
  $('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showView(b.dataset.view); });

  /* ---------- init ---------- */
  (async function init() {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    books = (await DB.all()).sort((a, b) => a.added - b.added);
    showCount();
    buildFeed();
  })();
})();
</script>
</body>
</html>
